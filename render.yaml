services:
  # Backend API
  - type: web
    name: cogestione-vian-api
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000

  # Frontend
  - type: web
    name: cogestione-vian-web
    runtime: static
    plan: free
    buildCommand: cd client && npm install && npm run build
    staticPublishDir: ./client/dist
    envVars:
      - key: VITE_API_URL
        value: https://cogestione-vian-api.onrender.com
